<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Gemini Journal</title>
    <meta name="description" content="Secure, production-grade AI journaling app with multi-turn reflection, automated summarization, sentiment analysis, and isolated Firestore persistence." />
    <meta property="og:title" content="Personal Gemini Journal" />
    <meta property="og:description" content="Secure, production-grade AI journaling app with multi-turn reflection, automated summarization, sentiment analysis, and isolated Firestore persistence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style id="theme-preload-style">
      html, body {
        background-color: #0A0A0B;
        color: #E0E0E0;
        margin: 0;
        padding: 0;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html.light,
      html.light body {
        background-color: #F8F9FA !important;
        color: #1F2937 !important;
      }
    </style>
    <script>
      (function() {
        try {
          var key = 'gemini_journal_theme';
          var saved = localStorage.getItem(key);
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#4285F4]/30 selection:text-white min-h-screen">
    <script>
      (function() {
        try {
          var theme = document.documentElement.getAttribute('data-theme') || 'dark';
          document.body.setAttribute('data-theme', theme);
          document.body.classList.remove('dark', 'light');
          document.body.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
